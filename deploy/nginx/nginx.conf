# Academic AI — nginx, the single published entrypoint for this project.
#
# Runs unprivileged: listens on 8080 inside the container, published as
# ${WEB_PORT} on the host. Binding 80 inside the container would need
# CAP_NET_BIND_SERVICE, and this container runs with no-new-privileges and a
# read-only root filesystem.

worker_processes auto;
# The container is read-only; every writable path is an explicit tmpfs.
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured, one JSON object per line, to match the backend. A mixed
    # format means the aggregator SESSION 15 chooses has to parse two.
    # $http_authorization is deliberately absent: nginx would write live
    # bearer tokens to disk on every request.
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Do not advertise the exact version to anybody scanning this shared host.
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Rate limits, per client IP. The login endpoint gets its own, an order of
    # magnitude tighter: argon2id is memory-hard by design, so an unthrottled
    # /auth/login is a way to spend this shared host's RAM on somebody else's
    # behalf as well as a way to guess passwords.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    include /etc/nginx/conf.d/*.conf;
}
