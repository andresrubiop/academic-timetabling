upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 8080;
    # No `server_name` pinned to a hostname: SESSION 8 was told not to invent
    # a domain, and this host is reached by IP. `_` matches whatever Host
    # arrives; the *authoritative* host check is BACKEND_ALLOWED_HOSTS in the
    # application, which is validated at boot and cannot be forgotten here.
    server_name _;

    limit_conn perip 32;

    # --- security headers ---------------------------------------------------
    # `always`, or nginx omits them on error responses -- which are exactly
    # the responses an attacker is trying to provoke.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # No HSTS while this is served over plain HTTP by IP. Sending it now would
    # pin browsers to https:// for a host that has no certificate, locking
    # users out of the platform until one exists. It is enabled in the TLS
    # block below, which is where it becomes true rather than aspirational.

    # --- health -------------------------------------------------------------
    # Serves the container's own healthcheck. Deliberately not proxied: it
    # must answer while the backend is still starting, or nginx never becomes
    # healthy and compose never brings the stack up.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # Readiness. Unlike /healthz above this one is *proxied*, because the
    # question it answers -- can the API reach its database and its queue --
    # can only be answered by the API.
    #
    # SESSION 21 found this missing. Without it `/readyz` fell through to
    # `location /` and was served by Next.js, which returned a 404 HTML page:
    # DEPLOYMENT.md told the operator to curl it as the check that the
    # database and queue were up, and the command answered from the wrong
    # service. A verification step that cannot fail is worse than none.
    #
    # Restricted to the host and the Docker networks. The body carries the
    # queue depth, which is operational detail rather than something to hand
    # to anybody who can reach the published port.
    location = /readyz {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://backend_upstream;
    }

    # --- API ----------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://backend_upstream;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend_upstream;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 120s;
    }

    # Long-running optimizer requests. A CP-SAT solve is measured in minutes,
    # and the default 60s read timeout would return 504 to a run that is
    # working perfectly.
    location /api/v1/optimization/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # --- frontend -----------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://frontend_upstream;
        # Next.js dev/HMR and any future websocket traffic.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — ready, deliberately not enabled.
#
# SESSION 8 was told to leave future HTTPS/domain support ready and not to
# invent a domain. Enabling this block needs three things this session does
# not have: a real hostname, a certificate for it, and port 443 on the host —
# which is currently held by another tenant's `uti_caddy`. Publishing 443
# would take it from them.
#
# To enable, once a domain exists:
#   1. put the certificate and key under deploy/nginx/certs/ (gitignored);
#   2. add `- "443:8443"` to the nginx service in docker-compose.yml, after
#      verifying with `ss -ltn` that 443 is actually free;
#   3. uncomment below and set server_name to the real hostname;
#   4. only then enable HSTS — it is a one-way door for the browsers that
#      see it, and max-age=31536000 on a host whose certificate later lapses
#      locks every user out for a year.
#
# server {
#     listen 8443 ssl;
#     http2 on;
#     server_name REPLACE.WITH.REAL.HOSTNAME;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     # ... then the same location blocks as above.
# }
